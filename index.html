<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail ღილაკი</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .gmail-button {
            display: inline-block;
            background-color: #EA4335; /* Gmail-ის წითელი ფერი */
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px; /* მომრგვალებული კუთხეები */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, transform 0.2s;
        }

        .gmail-button:hover {
            background-color: #c5221f; /* უფრო მუქი წითელი */
            transform: scale(1.05); /* ოდნავ გადიდება მაუსის მიტანისას */
        }
    </style>
</head>
<body>

    <a href="mailto:alexandreabesadze173@gmail.com" class="gmail-button">Gmail</a>

</body>
</html>
